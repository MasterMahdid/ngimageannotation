<div class="modal" id="mymodal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Modal title</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p>Modal body text goes here.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary">Save changes</button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<ul class="list-group">
  <li class="list-group-item" data-bs-toggle="tooltip" *ngFor="let da of data$ | async; let i = index" style="cursor: pointer;" [title]="'DNN Model:'+da.dnn_model+' | Confidence:'+da.confidence">
    <span class="badge bg-secondary me-2">{{i+1}}</span>{{ da.object }} ({{da.object_version}})
    <div class="float-end">
      <!-- <button class="btn"><i class="bi bi-info-lg"></i></button> -->
      <button class="btn btn-sm" title="Delete Annotation" (click)="deleteAnnotation(da.id)"><i
          class="bi bi-x-square-fill text-danger"></i></button>
    </div>
  </li>
</ul>
