<!-- Modal -->
<!-- Modal -->
<div class="modal fade" id="new-annotation-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">New Annotation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="object-name-input" class="form-label">Object</label>
            <input type="text" class="form-control" id="object-name-input" name="new_annot_version" [(ngModel)]="new_annot_object">
          </div>
          <div class="mb-3">
            <label for="object-version-input" class="form-label">version</label>
            <input type="text" class="form-control" id="object-version-input" name="new_annot_version" [(ngModel)]="new_annot_version">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="newAnnotation()">Add</button>
      </div>
    </div>
  </div>
</div>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-gradient">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">{{title}}</a>
    <button class="btn btn-primary bg-gradient" title="New Annotation" data-bs-toggle="modal"
      data-bs-target="#new-annotation-modal"><i class="bi bi-plus"></i></button>

  </div>
</nav>
